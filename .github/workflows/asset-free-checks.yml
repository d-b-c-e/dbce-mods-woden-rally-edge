name: Asset-free managed and setup checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: asset-free-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  managed-and-packaging:
    runs-on: windows-2025
    timeout-minutes: 15
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: tools/ci/global.json
          cache: false
      - name: Run explicit asset-free checks
        shell: pwsh
        working-directory: tools/ci
        run: ./Verify-AssetFree.ps1
